name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, format-check, and test
        run: ./gradlew --no-daemon formatCheck test lintDebug assembleDebug
      - name: Verify repository license policy
        run: |
          test -s LICENSE
          test -s NOTICE
          ! grep -R -n -E 'jitpack.io|mavenLocal\(\)' --include='*.gradle.kts' --include='*.toml' .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
